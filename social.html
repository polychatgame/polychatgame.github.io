<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PolyChat Social Hub</title>
    <style>
        body { margin: 0; font-family: Verdana, sans-serif; font-size: 13px; background: #fff; display: flex; height: 100vh; overflow: hidden; color: #000; }
        
        /* Login Overlay */
        #login-gate { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 10px solid #a7d7f9; }
        .login-box { border: 1px solid #a7d7f9; padding: 30px; background: #f6f6f6; width: 300px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .login-box h2 { font-family: "Linux Libertine", Georgia, serif; margin-top: 0; }
        .login-box input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: #eaf3ff; border: 1px solid #a7d7f9; cursor: pointer; font-weight: bold; color: #0645ad; }
        .login-box button:hover { background: #d0e4ff; }

        /* Sidebar & Main UI */
        #sidebar { width: 220px; background: #f6f6f6; border-right: 1px solid #a7d7f9; padding: 15px; display: flex; flex-direction: column; }
        .cool-header { font-family: "Linux Libertine", Georgia, serif; font-size: 1.3em; border-bottom: 1px solid #a7d7f9; margin: 10px 0; color: #000; }
        .nav-item { padding: 8px; cursor: pointer; color: #0645ad; text-decoration: none; border-radius: 3px; }
        .nav-item:hover { background: #eaf3ff; text-decoration: underline; }
        .active-tab { font-weight: bold; color: #000; background: #eaf3ff; border-left: 4px solid #a7d7f9; }

        #content-area { flex-grow: 1; overflow-y: auto; padding: 25px; }
        .view-pane { display: none; }
        .active-pane { display: block; }

        /* Forum Cards */
        .post-card { border: 1px solid #a7d7f9; padding: 15px; margin-bottom: 15px; background: #fff; }
        .post-user { font-weight: bold; color: #0645ad; cursor: pointer; }
        .composer { background: #f8f9fa; border: 1px solid #a7d7f9; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; height: 60px; border: 1px solid #ccc; padding: 8px; box-sizing: border-box; }

        /* DM UI */
        #dm-grid { display: grid; grid-template-columns: 200px 1fr; height: 500px; border: 1px solid #a7d7f9; }
        #contact-list { border-right: 1px solid #eee; overflow-y: auto; background: #fafafa; }
        #chat-window { display: flex; flex-direction: column; background: #fff; }
        #messages-box { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { padding: 8px; border-radius: 4px; margin-bottom: 5px; max-width: 70%; }
        .msg.sent { background: #eaf3ff; align-self: flex-end; border: 1px solid #a7d7f9; }
        .msg.received { background: #eee; align-self: flex-start; }
        .contact-btn { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .contact-btn:hover { background: #eaf3ff; }
    </style>
</head>
<body>

<div id="login-gate">
    <div class="login-box">
        <h2>PolyChat Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn" onclick="handleLogin()">Log In</button>
        <p style="text-align:center; font-size: 0.8em; color: #666;">New? Registration is automatic on Login</p>
    </div>
</div>

<div id="sidebar">
    <div class="cool-header">PolyChat Social</div>
    <div class="nav-item active-tab" id="nav-General" onclick="showView('forum', 'General')">General</div>
    <div class="nav-item" id="nav-Updates" onclick="showView('forum', 'Updates')">Updates</div>
    <div class="nav-item" id="nav-Trading" onclick="showView('forum', 'Trading')">Trading</div>
    <div class="cool-header">Messaging</div>
    <div class="nav-item" id="nav-DMs" onclick="showView('dms')">Direct Messages</div>
    <div style="margin-top:auto">
        <div class="nav-item" onclick="auth.signOut()">Sign Out</div>
    </div>
</div>

<div id="content-area">
    <h1 class="cool-header" id="view-title">General Discussion</h1>

    <div id="forum-pane" class="view-pane active-pane">
        <div class="composer">
            <textarea id="postInput" placeholder="Write something to the community..."></textarea>
            <button onclick="createPost()" style="margin-top:10px;">Post Thread</button>
        </div>
        <div id="post-feed">Loading posts...</div>
    </div>

    <div id="dm-pane" class="view-pane">
        <div id="dm-grid">
            <div id="contact-list"></div>
            <div id="chat-window">
                <div id="messages-box">Select a player to chat</div>
                <div style="padding:10px; border-top:1px solid #eee; display:flex;">
                    <input type="text" id="dmInput" style="flex-grow:1; padding:8px;" placeholder="Message...">
                    <button onclick="sendDM()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAR-GU7A_UiiIznWPwQmQYM92DyP4I7RvE",
      authDomain: "polychat-6347a.firebaseapp.com",
      projectId: "polychat-6347a",
      storageBucket: "polychat-6347a.firebasestorage.app",
      messagingSenderId: "551598113279",
      appId: "1:551598113279:web:2678519b8c5046cfb0a7ca",
      measurementId: "G-5H5ZKV9RFE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentCat = "General";
    let activeDMUser = null;
    let unsubFeed = null;
    let unsubDMs = null;

    async function handleLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        if(!e || !p) return alert("Enter email and password");

        btn.innerText = "Authenticating...";
        btn.disabled = true;

        try {
            await auth.signInWithEmailAndPassword(e, p);
        } catch (err) {
            try {
                const cred = await auth.createUserWithEmailAndPassword(e, p);
                await db.collection("players").doc(cred.user.uid).set({
                    name: e.split('@')[0],
                    email: e,
                    joined: Date.now()
                });
            } catch(regErr) {
                alert("Login Error: " + regErr.message);
                btn.innerText = "Log In";
                btn.disabled = false;
            }
        }
    }

    auth.onAuthStateChanged(user => {
        const btn = document.getElementById('loginBtn');
        if (user) {
            document.getElementById('login-gate').style.display = 'none';
            showView('forum', 'General');
        } else {
            document.getElementById('login-gate').style.display = 'flex';
            btn.innerText = "Log In";
            btn.disabled = false;
        }
    });

    function showView(type, cat = null) {
        document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active-pane'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));

        if (type === 'forum') {
            currentCat = cat;
            document.getElementById('forum-pane').classList.add('active-pane');
            document.getElementById('nav-' + cat).classList.add('active-tab');
            document.getElementById('view-title').innerText = cat + " Discussion";
            loadPosts();
        } else {
            document.getElementById('dm-pane').classList.add('active-pane');
            document.getElementById('nav-DMs').classList.add('active-tab');
            document.getElementById('view-title').innerText = "Direct Messages";
            loadPlayers();
        }
    }

    function loadPosts() {
        if (unsubFeed) unsubFeed();
        unsubFeed = db.collection("threads")
            .where("category", "==", currentCat)
            .onSnapshot(snap => {
                let posts = [];
                snap.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
                posts.sort((a,b) => b.timestamp - a.timestamp);

                let html = "";
                posts.forEach(data => {
                    html += `
                        <div class="post-card">
                            <div class="post-user">${data.author}</div>
                            <div style="margin:10px 0;">${data.content}</div>
                            <div style="font-size:0.8em; color:#666;">
                                <span style="cursor:pointer; color:#0645ad; margin-right:10px;" onclick="react('${data.id}', 'likes')">Like (${data.likes?.length || 0})</span>
                                <span style="cursor:pointer; color:#0645ad;" onclick="react('${data.id}', 'dislikes')">Dislike (${data.dislikes?.length || 0})</span>
                            </div>
                        </div>`;
                });
                document.getElementById('post-feed').innerHTML = html || "No threads here yet.";
            });
    }

    async function createPost() {
        const text = document.getElementById('postInput').value;
        if (!text) return;
        await db.collection("threads").add({
            author: auth.currentUser.email.split('@')[0],
            content: text,
            category: currentCat,
            timestamp: Date.now(),
            likes: [],
            dislikes: []
        });
        document.getElementById('postInput').value = "";
    }

    async function react(id, type) {
        const ref = db.collection("threads").doc(id);
        const doc = await ref.get();
        let arr = doc.data()[type] || [];
        const uid = auth.currentUser.uid;
        if(arr.includes(uid)) {
            arr = arr.filter(u => u !== uid);
        } else {
            arr.push(uid);
        }
        await ref.update({ [type]: arr });
    }

    async function loadPlayers() {
        const snap = await db.collection("players").get();
        let html = "";
        snap.forEach(doc => {
            if (doc.id !== auth.currentUser.uid) {
                html += `<div class="contact-btn" onclick="startChat('${doc.id}', '${doc.data().name}')">${doc.data().name}</div>`;
            }
        });
        document.getElementById('contact-list').innerHTML = html || "No other players online.";
    }

    function startChat(uid, name) {
        activeDMUser = uid;
        document.getElementById('messages-box').innerHTML = "Chatting with " + name + "...";
        if (unsubDMs) unsubDMs();
        
        unsubDMs = db.collection("direct_messages")
            .where("participants", "array-contains", auth.currentUser.uid)
            .onSnapshot(snap => {
                let msgs = snap.docs
                    .map(d => d.data())
                    .filter(m => m.participants.includes(uid))
                    .sort((a,b) => a.timestamp - b.timestamp);
                
                let html = "";
                msgs.forEach(m => {
                    const type = m.senderId === auth.currentUser.uid ? "sent" : "received";
                    html += `<div class="msg ${type}">${m.text}</div>`;
                });
                document.getElementById('messages-box').innerHTML = html || "No messages yet.";
            });
    }

    async function sendDM() {
        const txt = document.getElementById('dmInput').value;
        if (!txt || !activeDMUser) return;
        await db.collection("direct_messages").add({
            participants: [auth.currentUser.uid, activeDMUser],
            senderId: auth.currentUser.uid,
            text: txt,
            timestamp: Date.now()
        });
        document.getElementById('dmInput').value = "";
    }
</script>
</body>
</html>
